name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 数学核心测试
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 运行测试
        run: node tests/matrix.test.mjs

  offline:
    name: 单文件零依赖承诺
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 不得引用任何外部资源
        run: |
          # 卖点是「下载 index.html 双击就能离线用」，加了 CDN 就破了。
          cat > /tmp/check.py <<'PY'
          import re, sys
          html = open("index.html", encoding="utf-8").read()
          problems = []
          for pat, what in [
              (r'<script[^>]+\bsrc\s*=', '外部 script src'),
              (r'<link[^>]+\bhref\s*=\s*["\']https?://', '外部样式表或字体'),
              (r'<img[^>]+\bsrc\s*=\s*["\']https?://', '外部图片'),
              (r'@import\s+url\(\s*["\']?https?://', 'CSS @import 外部'),
              (r'url\(\s*["\']?https?://', 'CSS url() 外部资源'),
              (r'\bfetch\s*\(', 'fetch 调用'),
              (r'XMLHttpRequest', 'XMLHttpRequest'),
              (r'new\s+WebSocket', 'WebSocket'),
              (r'\.src\s*=\s*["\']https?://', '动态设置的远程 src'),
          ]:
              for m in re.finditer(pat, html, re.I):
                  line = html[:m.start()].count("\n") + 1
                  problems.append(f"  L{line}: {what} → {m.group(0)[:60]}")
          if problems:
              print("::error::index.html 不再自包含，离线可用性被破坏")
              print("\n".join(problems))
              sys.exit(1)
          print("index.html 完全自包含：无外部资源、无联网调用 ✓")
          print(f"  文件大小 {len(html.encode('utf-8')) / 1024:.1f} KB")
          PY
          python3 /tmp/check.py

      - name: 确认测试覆盖的是真实源码
        run: |
          for marker in "function parseMat(t)" "function ackermann" "function setupCanvas"; do
            if ! grep -qF "$marker" index.html; then
              echo "::error file=index.html::测试抽取依赖的标记缺失: $marker"
              exit 1
            fi
          done
          echo "测试抽取标记齐全 ✓"
